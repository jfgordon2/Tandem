<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Route preview</title>
<style>@font-face{font-family:Figtree;font-weight:400;src:url('../../../assets/fonts/Figtree-Regular.ttf')}@font-face{font-family:Figtree;font-weight:500;src:url('../../../assets/fonts/Figtree-Medium.ttf')}@font-face{font-family:Figtree;font-weight:600;src:url('../../../assets/fonts/Figtree-SemiBold.ttf')}@font-face{font-family:Figtree;font-weight:700;src:url('../../../assets/fonts/Figtree-Bold.ttf')}@font-face{font-family:Figtree;font-weight:800;src:url('../../../assets/fonts/Figtree-ExtraBold.ttf')}</style></head>
<body>




<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #000000; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; gap: 14px; padding: 14px; overflow: hidden;">
  <div style="flex-grow: 1; min-width: 0; border-radius: 22px; overflow: hidden; position: relative; background: #111821;">
    <svg width="660" height="535" viewBox="0 0 660 535" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <g stroke="#1C2733" stroke-width="10" fill="none">
        <path d="M0 90H660M0 230H660M0 380H660M0 490H660"></path>
        <path d="M110 0V535M260 0V535M420 0V535M560 0V535"></path>
      </g>
      <text x="340" y="280" text-anchor="middle" fill="#AEB6C2" font-family="Figtree" font-size="18">This place has no usable coordinates</text>



    </svg>
    <a href="destinations.html" aria-label="Back" style="position: absolute; left: 14px; top: 14px; width: 60px; height: 60px; border-radius: 16px; background: #0B0D10E6; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </div>
  <div style="width: 400px; flex-shrink: 0; background: #16191D; border-radius: 22px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800;">Hardware Store</h1>
      <span style="font-size: 16px; color: #AEB6C2;">100 Market St, Des Moines</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Arrive</span><span style="font-size: 22px; font-weight: 700;">–</span></div>
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Time</span><span style="font-size: 22px; font-weight: 700;">–</span></div>
      <div style="flex-grow: 1; background: #1E2227; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 13px; color: #9FAABA;">Distance</span><span style="font-size: 22px; font-weight: 700;">–</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #C9D0DA;">
      <div style="display: flex; gap: 10px; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Slows ahead of turns on the route</div>
      <div style="display: flex; gap: 10px; align-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FD8A0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Road data still supplies speed limits</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; gap: 10px;">
      <button type="button" aria-label="Save as favorite" style="width: 64px; height: 64px; border: 0; border-radius: 16px; background: #23272E; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
      <a href="onroadnav.html" style="flex-grow: 1; text-decoration: none; height: 64px; border-radius: 16px; background: #23272E; color: #8FA0B5; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">Start</a>
    </div>
  </div>
</div>

</html>
