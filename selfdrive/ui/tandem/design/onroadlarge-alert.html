<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onroad larger text, warning</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #000000; padding: 10px; font-family: Figtree, system-ui, sans-serif; color: #F2F5F9;">
  <div style="width: 100%; height: 100%; box-sizing: border-box; border: 6px solid #E0A23A; border-radius: 18px; overflow: hidden; position: relative; background: #0F1A24;">
    <svg width="1093" height="531" viewBox="0 0 1093 531" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <rect x="0" y="0" width="1093" height="230" fill="#0F1A24"></rect>
      <rect x="0" y="230" width="1093" height="301" fill="#132231"></rect>
      <path d="M520 226 L116 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M576 226 L984 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M534 228 L560 228 L729 531 L377 531 Z" fill="#3A73B3" fill-opacity="0.55"></path>
      <path d="M330 424 Q546 392 762 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" fill="none" stroke-linecap="round"></path>
      <path d="M330 424 Q546 392 762 424" pathLength="100" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="14 200" stroke-dashoffset="-50"></path>
    </svg>
    <div style="position: absolute; left: 16px; top: 16px; width: 106px; height: 126px; border-radius: 18px; background: #0B0D10; display: flex; align-items: center; justify-content: center;">
      <div style="width: 82px; height: 102px; box-sizing: border-box; border-radius: 10px; background: #FFFFFF; border: 4px solid #0B0D10; outline: 2px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0D10; line-height: 1;">
        <span style="font-size: 13px; font-weight: 800;">SPEED</span>
        <span style="font-size: 13px; font-weight: 800;">LIMIT</span>
        <span style="font-size: 42px; font-weight: 800; margin-top: 3px;">60</span>
      </div>
    </div>
    <div aria-label="Driver monitoring: distracted" style="position: absolute; right: 16px; top: 16px; width: 84px; height: 84px; border-radius: 18px; background: #0B0D10; display: flex; align-items: center; justify-content: center;">
      <div style="width: 66px; height: 66px; box-sizing: border-box; border-radius: 50%; border: 4px solid #F0B35A; display: flex; align-items: center; justify-content: center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M5 20.5a7 7 0 0 1 14 0"></path></svg>
      </div>
    </div>
    <div style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #0B0D10E6; border-radius: 26px; padding: 10px 48px 10px 36px; display: flex; align-items: center; gap: 26px;">
      <svg width="60" height="39" viewBox="0 0 46 30" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5L8 15l10 10" stroke="#3FD08A"></path><path d="M36 5L26 15l10 10" stroke="#2A8F5E"></path></svg>
      <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
        <span style="font-size: 82px; font-weight: 800;">62</span>
        <span style="font-size: 22px; color: #C9D0DA;">mph</span>
      </div>
    </div>
    <div role="alert" style="position: absolute; left: 14px; right: 14px; bottom: 14px; background: #3A2C14F2; border-radius: 20px; padding: 18px 24px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 34px; font-weight: 800; color: #FFD08A;">Pay attention</span>
      <span style="font-size: 22px; color: #F0DDBD;">Look at the road ahead</span>
    </div>
  </div>
</div>

</body>
</html>
