<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onroad larger text, higher limit</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #000000; padding: 10px; font-family: Figtree, system-ui, sans-serif; color: #F2F5F9;">
  <div style="width: 100%; height: 100%; box-sizing: border-box; border: 6px solid #1F9A55; border-radius: 18px; overflow: hidden; position: relative; background: #0F1A24;">
    <svg width="1093" height="531" viewBox="0 0 1093 531" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
      <rect x="0" y="230" width="1093" height="301" fill="#132231"></rect>
      <path d="M520 226 L116 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M576 226 L984 531" stroke="#5C6B7A" stroke-width="5" stroke-linecap="round"></path>
      <path d="M534 228 L560 228 L729 531 L377 531 Z" fill="#3A73B3" fill-opacity="0.55"></path>
      <path d="M330 424 Q546 392 762 424" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" fill="none" stroke-linecap="round"></path>
      <path d="M330 424 Q546 392 762 424" pathLength="100" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="14 200" stroke-dashoffset="-50"></path>
    </svg>
    <div style="position: absolute; left: 50%; top: 21px; transform: translateX(-50%); background: #0B0D10E6; border-radius: 29px; padding: 13px 52px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span style="font-size: 81px; font-weight: 800;">45</span>
      <span style="font-size: 22px; color: #C9D0DA;">mph</span>
    </div>
    <div style="position: absolute; left: 16px; top: 16px; width: 405px; box-sizing: border-box; background: #16191DF5; border: 3px solid #5AAAF8; border-radius: 26px; padding: 13px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="width: 78px; height: 96px; box-sizing: border-box; border-radius: 10px; background: #FFFFFF; border: 4px solid #0B0D10; outline: 3px solid #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0B0D10; line-height: 1; flex-shrink: 0;">
          <span style="font-size: 13px; font-weight: 800;">SPEED</span>
          <span style="font-size: 13px; font-weight: 800;">LIMIT</span>
          <span style="font-size: 42px; font-weight: 800; margin-top: 3px;">55</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
          <span style="font-size: 29px; font-weight: 800;">New limit 55</span>
          <span style="font-size: 21px; color: #C9D0DA;">Speed up to 58 mph?</span>
          <span style="font-size: 17px; color: #8FA0B5;">From map · ignored in 8 s</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px;">
        <button type="button" style="font-family: inherit; height: 72px; border: 0; border-radius: 20px; background: #23272E; color: #F2F5F9; font-size: 23px; font-weight: 700;">Ignore</button>
        <button type="button" style="font-family: inherit; height: 72px; border: 0; border-radius: 20px; background: #5AAAF8; color: #0B1A2B; font-size: 23px; font-weight: 800;">Match</button>
      </div>
      <div style="height: 5px; border-radius: 3px; background: #2A2F36;"><div style="width: 60%; height: 5px; border-radius: 3px; background: #5AAAF8;"></div></div>
    </div>
    <div aria-label="Driver monitoring: attentive" style="position: absolute; right: 23px; top: 23px; width: 83px; height: 83px; border-radius: 18px; background: #0B0D10; display: flex; align-items: center; justify-content: center;">
      <div style="width: 65px; height: 65px; box-sizing: border-box; border-radius: 50%; border: 4px solid #3FD08A; display: flex; align-items: center; justify-content: center;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M5 20.5a7 7 0 0 1 14 0"></path></svg>
      </div>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center; gap: 16px; padding: 0 18px;">
      <button type="button" aria-label="Menu" style="flex-shrink: 0; width: 96px; height: 96px; border-radius: 23px; border: 0; background: #1F2328CC; display: flex; align-items: center; justify-content: center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F2F5F9" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg></button>
      <div style="height: 96px; border-radius: 23px; background: #1F2328CC; display: flex; align-items: center; gap: 5px; padding: 0 8px;">
        <button type="button" aria-label="Lower max speed" style="font-family: inherit; width: 68px; height: 81px; border: 0; background: transparent; color: #F2F5F9; font-size: 36px;">−</button>
        <div style="width: 91px; display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #7DBBF9;">MAX</span>
          <span style="font-size: 39px; font-weight: 800; margin-top: 4px;">48</span>
        </div>
        <button type="button" aria-label="Raise max speed" style="font-family: inherit; width: 68px; height: 81px; border: 0; background: transparent; color: #F2F5F9; font-size: 36px;">+</button>
      </div>
      <span style="flex-grow: 1; font-size: 15px; color: #8FA0B5; padding-left: 10px;">Asks for higher or lower limits, as set in Speed Limits. A lower one asks “Slow down to 48 mph?”. Resume on the wheel also matches.</span>
      <button type="button" aria-label="Disengage" style="flex-shrink: 0; width: 96px; height: 96px; border-radius: 23px; border: 0; background: #1F9A55; display: flex; align-items: center; justify-content: center;"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M3.5 10.5h6M14.5 10.5h6M12 14.5V21"></path></svg></button>
    </div>
  </div>
</div>

</body>
</html>
