<!DOCTYPE html><html lang="en"><head>

<title>Connections: Car Audio and Devices</title>
<style>@font-face{font-family:Figtree;font-weight:400;src:url('../../../assets/fonts/Figtree-Regular.ttf')}
@font-face{font-family:Figtree;font-weight:500;src:url('../../../assets/fonts/Figtree-Medium.ttf')}
@font-face{font-family:Figtree;font-weight:600;src:url('../../../assets/fonts/Figtree-SemiBold.ttf')}
@font-face{font-family:Figtree;font-weight:700;src:url('../../../assets/fonts/Figtree-Bold.ttf')}

.radio-control{display:flex;align-items:center;gap:10px;color:#C9D0DA;font-size:14px;font-weight:600;flex-shrink:0}
.radio-control button{box-sizing:border-box;display:flex;align-items:center;justify-content:flex-start;width:72px;height:42px;border:0;
border-radius:21px;background:#343A44;padding:4px;flex-shrink:0}
.radio-control button[aria-checked=true]{background:#5AAAF8;justify-content:flex-end}
.radio-control button span{width:34px;height:34px;border-radius:17px;background:#F2F5F9}
.radio-control button[aria-checked=true] span{background:#0E1520}
.radio-empty{color:#AEB6C2;font-size:16px;padding:18px 22px}
.radio-actions{display:flex;align-items:center;gap:14px}
.radio-muted{opacity:.45}
</style></head>
<body>


<style>
body{margin:0}

<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #000000; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

      <a href="connections.html" aria-current="page" style="text-decoration: none; height: 74px; border-radius: 18px; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Connections</a>
      <a href="softwaretab.html" style="text-decoration: none; height: 74px; border-radius: 18px; color: #C9D0DA; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center;">Software</a>
