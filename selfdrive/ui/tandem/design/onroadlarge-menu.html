<style id="street-scroll">
/* A street name that doesn't fit scrolls: it rests at its start, slides left until its end shows, rests, then fades
   back to the start. One that fits stays still. With reduced motion it keeps the ellipsis. */
.street { display: block; flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.street > span { display: inline-block; }
.street.scrolls { text-overflow: clip; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.street.scrolls > span { padding-right: 28px; animation: street-scroll var(--dur, 10s) ease-in-out infinite; }
@keyframes street-scroll { 0%, 22% { transform: translateX(0); opacity: 1 } 74%, 94% { transform: translateX(var(--shift)); opacity: 1 } 100% { transform: translateX(var(--shift)); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .street.scrolls { text-overflow: ellipsis; -webkit-mask-image: none; mask-image: none; } .street.scrolls > span { animation: none; padding-right: 0; } }
</style>

<script>
// Mock only: measure each street name, and scroll the ones that don't fit at about 40 px a second.
document.querySelectorAll('.street').forEach((el) => {
  const shift = el.firstElementChild.scrollWidth - el.clientWidth;
  if (shift > 1) {
    el.classList.add('scrolls');
    el.style.setProperty('--shift', `${-(shift + 28)}px`);
    el.style.setProperty('--dur', `${(5 + (shift + 28) / 40) / 0.52}s`);
  }
});
</script>
