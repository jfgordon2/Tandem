<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Delete offline maps</title>
<style>body{margin:0}@font-face{font-family:Figtree;src:url("../../assets/fonts/Figtree-Regular.ttf");font-weight:400}
@font-face{font-family:Figtree;src:url("../../assets/fonts/Figtree-Medium.ttf");font-weight:500}
@font-face{font-family:Figtree;src:url("../../assets/fonts/Figtree-SemiBold.ttf");font-weight:600}
@font-face{font-family:Figtree;src:url("../../assets/fonts/Figtree-Bold.ttf");font-weight:700}
@font-face{font-family:Figtree;src:url("../../assets/fonts/Figtree-ExtraBold.ttf");font-weight:800}</style><body>
<div style="width:1125px;height:563px;position:relative;overflow:hidden;background:#050608;color:#F2F5F9;font-family:Figtree, sans-serif">
  <img aria-hidden="true" src="screenshots/systemstorage.png" style="position:absolute;inset:0;width:100%;height:100%;opacity:.24">
  <div style="position:absolute;inset:0;display:grid;grid-template-columns: repeat(2, minmax(0, 1fr));place-content:center;grid-template-columns:520px;">
    <section role="dialog" aria-label="Delete offline maps" style="background: #1A1D22; border: 1px solid #2A2F36; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 18px;">
      <div style="width: 60px; height: 60px; border-radius: 18px; background: #3A2026; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2A7B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 26px; font-weight: 800;">Delete offline maps?</h2>
        <span style="font-size: 17px; color: #C9D0DA; line-height: 1.4;">Remove all downloaded maps from this device. Your regions stay chosen.</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #2A2F36; color: #F2F5F9; font-size: 19px; font-weight: 700;">Cancel</button>
        <button type="button" style="font-family: inherit; height: 64px; border: 0; border-radius: 16px; background: #C8404D; color: #FFFFFF; font-size: 19px; font-weight: 800;">Delete</button>
      </div>
    </section>
  </div>
</div></body></html>
