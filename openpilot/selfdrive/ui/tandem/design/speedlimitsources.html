<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speed limit sources</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBBF9}a:hover{color:#A9D3FB}
</style>
<div style="width: 1125px; height: 563px; box-sizing: border-box; background: #050608; color: #F2F5F9; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">
  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 18px; height: 110px; border-radius: 22px; background: #0C0E11;"></div>
  <section aria-label="Speed limit sources" style="position: relative; height: 412px; box-sizing: border-box; background: #16191D; border-radius: 26px 26px 0 0; border-top: 1px solid #262B33; padding: 14px 22px 22px; display: flex; flex-direction: column; gap: 12px;">
    <div style="align-self: center; width: 64px; height: 6px; border-radius: 3px; background: #3A414C;"></div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;"><h2 style="margin: 0; font-size: 28px; font-weight: 800;">Speed limit sources</h2><span style="font-size: 15px; color: #AEB6C2;">When more than one has a limit, the first one wins</span></div>
      <a href="driving-limitsources.html" style="text-decoration: none; height: 60px; padding: 0 30px; border-radius: 16px; background: #5AAAF8; color: #0B1A2B; font-size: 18px; font-weight: 800; display: flex; align-items: center;">Done</a>
    </div>
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 8px; height: 66px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 19px; font-weight: 600;">First</span><span style="font-size: 14px; color: #AEB6C2;">Used whenever it has a limit</span></div>
        <div role="radiogroup" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px; gap: 2px;"><button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 700;">Maps</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Camera</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Car</button></div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 8px; height: 66px; border-bottom: 1px solid #23272E;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 19px; font-weight: 600;">Second</span><span style="font-size: 14px; color: #AEB6C2;">When the first has none</span></div>
        <div role="radiogroup" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px; gap: 2px;"><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Off</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Maps</button><button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 700;">Camera</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Car</button></div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 0 8px; height: 66px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 19px; font-weight: 600;">Third</span><span style="font-size: 14px; color: #AEB6C2;">When neither has one</span></div>
        <div role="radiogroup" style="display: flex; background: #23272E; border-radius: 13px; padding: 4px; gap: 2px;"><button type="button" role="radio" aria-checked="true" style="font-family: inherit; border: 0; background: #5AAAF8; color: #0B1A2B; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 700;">Off</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Maps</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Camera</button><button type="button" role="radio" aria-checked="false" style="font-family: inherit; border: 0; background: transparent; color: #C9D0DA; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600;">Car</button></div>
      </div>
    </div>
    <span style="font-size: 14px; color: #8FA0B5; padding: 0 8px;">Maps reads your offline maps. Camera reads signs as you pass them. Car uses its own sign reading.</span>
  </section>
</div>
<!-- Only the sources StarPilot offers for this car appear (Car needs the car to read signs; Maps needs an offline map package). -->
</body>
</html>
